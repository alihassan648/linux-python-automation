[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analyzer"
version = "0.1.0"
description = "A multi-file log analyzer with JSON and summary output"
authors = [
    { name="Sohail Ali", email="sohailalihassan648@gmail.com" }
]
dependencies = []

[project.scripts]
log-analyzer = "log_analyzer.log_analyzer:main"

[tool.setuptools.packages.find]
where = ["src"]
